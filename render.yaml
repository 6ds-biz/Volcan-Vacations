services:
  - type: web
    name: volcan-vacations-api
    runtime: python
    plan: free
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: volcan-vacations-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: volcan-vacations-db
    databaseName: volcan_vacations
    user: volcan_vacations
    plan: free
