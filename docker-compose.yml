services:
  postgres:
    image: postgres:15-alpine
    container_name: volcan-vacations-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-volcan_dev}
      POSTGRES_USER: ${POSTGRES_USER:-volcan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volcan_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: volcan-vacations-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-volcan_user}:${POSTGRES_PASSWORD:-volcan_pass}@postgres:5432/${POSTGRES_DB:-volcan_dev}
      API_PORT: ${API_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./services/api:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: volcan-vacations-web
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then((r)=>process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5

  ops:
    build:
      context: ./apps/ops
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: volcan-vacations-ops
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      OPS_API_URL: http://api:8000
      OPS_ENVIRONMENT: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./apps/ops:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001').then((r)=>process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
    name: volcan-vacations-postgres-data
